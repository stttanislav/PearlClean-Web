<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#087d92" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PearlClean" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>PearlClean</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="wordmark" href="#home" aria-label="PearlClean — головна">PEARLCLEAN</a>
        <button class="install-button" id="installButton" type="button"><span>＋</span> Додати на екран</button>
      </header>
      <main id="app" tabindex="-1"></main>
      <nav class="tabbar" aria-label="Навігація">
        <button data-route="home" class="active"><span>⌂</span>Головна</button>
        <button data-route="calendar"><span>□</span>Календар</button>
        <button data-route="insights"><span>▥</span>Аналітика</button>
        <button data-route="settings"><span>⚙</span>Налаштування</button>
      </nav>
    </div>
    <dialog id="installDialog" class="install-dialog">
      <button class="close-dialog" aria-label="Закрити" type="button">×</button>
      <img src="icons/icon.svg" alt="Іконка PearlClean" />
      <h2>Встановіть PearlClean</h2>
      <p id="installInstructions"></p>
      <button class="primary close-install" type="button">Зрозуміло</button>
    </dialog>
    <div class="toast" id="toast" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
